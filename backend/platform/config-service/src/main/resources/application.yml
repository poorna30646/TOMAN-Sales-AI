server:
  port: ${SERVER_PORT:8888}

spring:
  application:
    name: toman-config-service
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: ${CONFIG_REPOSITORY_PATH:classpath:/config}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

info:
  toman:
    service: config-service

spring:
  datasource:
    url: ${JARVIS_DATABASE_URL:jdbc:mariadb://localhost:3306/toman_jarvis?useSsl=false}
    username: ${JARVIS_DATABASE_USERNAME:toman_app}
    password: ${JARVIS_DATABASE_PASSWORD:}

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${DISCOVERY_URL:http://localhost:8761/eureka/}

toman:
  meta:
    # Meta is the only supported provider for Jarvis and all agent plans.
    base-url: ${META_AI_BASE_URL:https://api.meta.ai/v1}
    api-key: ${META_AI_API_KEY:}
    model: ${META_AI_MODEL:muse-spark-1.3}
    timeout: ${META_AI_TIMEOUT:30s}
    enabled: ${META_AI_ENABLED:true}

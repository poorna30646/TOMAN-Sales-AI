spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

# Local TOMAN services all run on this machine. Explicitly advertise the
# loopback address so Gateway never tries to route through a transient VPN or
# Wi-Fi address. Shared/deployed environments can override both settings.
eureka:
  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:true}
    ip-address: ${EUREKA_INSTANCE_IP_ADDRESS:127.0.0.1}

toman:
  platform:
    approval-required-for-external-actions: true
    eventing: outbox

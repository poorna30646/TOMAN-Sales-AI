server:
  port: ${SERVER_PORT:8087}
  error:
    include-message: never

spring:
  application:
    name: notification-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  datasource:
    url: ${NOTIFICATION_DATABASE_URL:jdbc:mariadb://localhost:3306/toman_notification?useSsl=false}
    username: ${NOTIFICATION_DATABASE_USERNAME:toman_app}
    password: ${NOTIFICATION_DATABASE_PASSWORD:}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_uuid_jdbc_type: BINARY
  flyway:
    enabled: true
    locations: classpath:db/migration

eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${DISCOVERY_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

toman:
  notifications:
    # This endpoint is fail-closed. Set a high-entropy value shared only by
    # trusted TOMAN services; never expose it to the mobile app.
    internal-api-key: ${NOTIFICATION_INTERNAL_API_KEY:}
  gateway-trust:
    shared-key: ${TOMAN_GATEWAY_INTERNAL_KEY:}

info:
  toman:
    delivery: persistent in-app notification center only; OS push is not configured

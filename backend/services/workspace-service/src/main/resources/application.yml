spring:
  application:
    name: workspace-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  datasource:
    url: ${WORKSPACE_DATABASE_URL:jdbc:mariadb://localhost:3306/toman_workspace?useSsl=false}
    username: ${WORKSPACE_DATABASE_USERNAME:toman_app}
    password: ${WORKSPACE_DATABASE_PASSWORD:}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_uuid_jdbc_type: BINARY
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8082}
  error:
    include-message: never

eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${DISCOVERY_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

info:
  toman:
    service: workspace-service

toman:
  gateway-trust:
    shared-key: ${TOMAN_GATEWAY_INTERNAL_KEY:}

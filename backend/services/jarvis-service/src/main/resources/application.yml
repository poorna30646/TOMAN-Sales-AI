server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: jarvis-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  datasource:
    url: ${JARVIS_DATABASE_URL:jdbc:mariadb://localhost:3306/toman_jarvis?useSsl=false}
    username: ${JARVIS_DATABASE_USERNAME:toman_app}
    password: ${JARVIS_DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_uuid_jdbc_type: BINARY
  flyway:
    enabled: true

eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${DISCOVERY_URL:http://localhost:8761/eureka/}

toman:
  meta:
    # Only Meta Model API is supported by this service. Keep META_AI_API_KEY on
    # the server; it must never be included in mobile responses or source code.
    base-url: ${META_AI_BASE_URL:https://api.meta.ai/v1}
    api-key: ${META_AI_API_KEY:}
    model: ${META_AI_MODEL:muse-spark-1.3}
    timeout: ${META_AI_TIMEOUT:30s}
    enabled: ${META_AI_ENABLED:true}
  notification-delivery:
    base-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8087}
    internal-api-key: ${NOTIFICATION_INTERNAL_API_KEY:}
    enabled: ${NOTIFICATION_DELIVERY_ENABLED:true}
    retry-delay: ${NOTIFICATION_RETRY_DELAY:PT15S}
    initial-delay: ${NOTIFICATION_INITIAL_DELAY:PT5S}
  gateway-trust:
    shared-key: ${TOMAN_GATEWAY_INTERNAL_KEY:}
  workspace-scope:
    base-url: ${WORKSPACE_SERVICE_URL:http://localhost:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

info:
  toman:
    ai-provider: Meta Model API only
    model: ${META_AI_MODEL:muse-spark-1.3}
